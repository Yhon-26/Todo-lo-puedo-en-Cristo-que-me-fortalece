<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Listado de órdenes de servicio</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
	<div class="container mt-5">
		<div class="card shadow-lg">
			<div class="card-body">
				<div class="row align-items-center mb-4">
					<div class="col-md-9">
						<h1 class="card-title">LISTADO DE ÓRDENES DE SERVICIO</h1>
					</div>
					<div class="col-md-3">
						<a th:href="@{/orden/nuevo}" class="btn btn-success w-100">+ NUEVA ORDEN</a>
					</div>
				</div>

				<form th:action="@{/orden/listado}" method="get" th:object="${filter}" class="border rounded p-3 mb-4">
					<div class="row align-items-end g-3">
						<div class="col-md-4">
							<label for="idCliente" class="form-label">Cliente</label>
							<select class="form-select" th:field="*{idCliente}">
								<option value="">--Todos--</option>
								<option th:each="item : ${lstClientes}" th:value="${item.idCliente}"
									th:text="${item.nombreCompleto}"></option>
							</select>
						</div>
						<div class="col-md-8 text-end">
							<button type="submit" class="btn btn-outline-dark">BUSCAR</button>
							<a th:href="@{/orden/listado}" class="btn btn-outline-secondary">LIMPIAR</a>
						</div>
					</div>
				</form>

				<div class="table-responsive">
					<table class="table table-bordered table-hover align-middle">
						<thead class="table-secondary">
							<tr>
								<th>Id</th>
								<th>Cliente</th>
								<th>Placa</th>
								<th>Servicio</th>
								<th>Fecha de ingreso</th>
								<th>Estado</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="item : ${lstOrdenes}">
								<td th:text="${item.idOrden}"></td>
								<td th:text="${item.cliente.nombreCompleto}"></td>
								<td th:text="${item.placa}"></td>
								<td th:text="${item.servicio}"></td>
								<td th:text="${item.fechaIngreso}"></td>
								<td th:text="${item.estadoDescripcion}"></td>
								<td></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<th:block th:utext="${alert}"></th:block>
</body>

</html>
